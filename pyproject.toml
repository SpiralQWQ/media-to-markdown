[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "media-to-markdown"
description = "Local video / image album / audio → cleaned, time-aligned Markdown"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "SpiralQWQ" },
]
dynamic = ["version"]
keywords = ["markdown", "transcription", "asr", "ocr", "video", "audio", "study-notes"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "numpy>=1.24",
    "python-dotenv>=1.0",
    "pypinyin>=0.51",
    "rapidfuzz>=3.0",
    "opencv-python>=4.8",
    "rapidocr-onnxruntime>=1.3",
]

[project.optional-dependencies]
asr = ["funasr>=1.0", "soundfile>=0.12", "torch>=2.0"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/SpiralQWQ/media-to-markdown"
Repository = "https://github.com/SpiralQWQ/media-to-markdown"
Changelog = "https://github.com/SpiralQWQ/media-to-markdown/blob/master/CHANGELOG.md"

[project.scripts]
media-to-markdown = "media_to_markdown.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = { find = { where = ["src"] } }

[tool.setuptools.dynamic]
version = { attr = "media_to_markdown.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
